<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タレントプロフィール | 架空Vライバー事務所</title>
    <style>
        /* 全体のベース設定（画像に合わせたダークな配色） */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #11161a; /* 画像のような深いダークグレー */
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* ページ全体のコンテナ（左右2カラムに分割） */
        .talent-container {
            display: flex;
            max-width: 1100px;
            width: 100%;
            background-color: #161c22; /* わずかに明るい背景でメリハリを */
            border: 1px solid #232d37;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* ==========================================
           左側：ビジュアルエリア
        ========================================== */
        .visual-side {
            width: 40%;
            background-color: #0d1114; /* 立ち絵の背景 */
            position: relative;
            min-height: 600px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            border-right: 1px solid #232d37;
        }
        /* メインの立ち絵（ダミー枠） */
        .main-illustration {
            width: 100%;
            height: 70%;
            background-color: #1a232a;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #4a5d6e;
            font-size: 1.1rem;
            border: 1px dashed #344656;
        }
        /* ミニキャラ（ダミー枠） */
        .mini-character {
            width: 120px;
            height: 120px;
            background-color: #1a232a;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #4a5d6e;
            font-size: 0.8rem;
            border: 1px dashed #344656;
            border-radius: 8px;
            margin-top: 20px;
        }

        /* ==========================================
           右側：情報エリア
        ========================================== */
        .info-side {
            width: 60%;
            padding: 40px;
            display: flex;
            flex-direction: column;
        }

        /* ヘッダー（名前とキャッチコピー） */
        .info-header {
            border-bottom: 2px solid #ffffff; /* 下の白い境界線 */
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .catchphrase {
            color: #a12323; /* 深みのある赤 */
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .talent-name-eng {
            font-size: 2.5rem;
            font-weight: 900;
            line-height: 1;
            letter-spacing: 1px;
        }
        .talent-name-ja {
            font-size: 0.9rem;
            color: #8a99a6;
            margin-top: 2px;
        }

        /* プロフィール文章 */
        .profile-section {
            margin-bottom: 40px;
        }
        .section-title {
            color: #a12323;
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .profile-text {
            color: #c5d1dc;
            line-height: 1.8;
            font-size: 1rem;
        }

        /* 下部の3連カード（グリッドレイアウト） */
        .data-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: auto; /* 一番下に押し下げる */
        }
        .data-card {
            background-color: #11161a;
            border: 1px solid #232d37;
            padding: 15px;
            border-radius: 4px;
        }
        .card-title {
            color: #a12323;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 15px;
            border-bottom: 1px solid #232d37;
            padding-bottom: 5px;
        }
        
        /* カード内のリスト形式 */
        .data-list {
            list-style: none;
            font-size: 0.85rem;
        }
        .data-list li {
            margin-bottom: 10px;
            color: #c5d1dc;
        }
        .data-list span.label {
            color: #627788;
            display: block;
            font-size: 0.75rem;
            margin-bottom: 2px;
        }

        /* レスポンシブ（スマホ対応） */
        @media (max-width: 768px) {
            .talent-container {
                flex-direction: column;
            }
            .visual-side, .info-side {
                width: 100%;
            }
            .visual-side {
                min-height: 400px;
            }
            .data-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="talent-container">
        
        <div class="visual-side">
            <div class="main-illustration">【ここにメインの立ち絵画像】</div>
            <div class="mini-character">【ミニキャラ】</div>
        </div>

        <div class="info-side">
            
            <div class="info-header">
                <p class="catchphrase">リライティング・アーティスト</p>
                <h1 class="talent-name-eng">GS</h1>
                <p class="talent-name-ja">じーえす</p>
            </div>

            <div class="profile-section">
                <h2 class="section-title">PROFILE</h2>
                <p class="profile-text">
                    現実の上書き能力を持つ「現実の改稿者」。<br><br>
                    金色の筆とスプレーを用いて<br>
                    書いた内容を現実化する。
                </p>
            </div>

            <div class="data-grid">
                
                <div class="data-card">
                    <h3 class="card-title">FAN</h3>
                    <ul class="data-list">
                        <li><span class="label">誕生日</span>🎂 4月27日</li>
                        <li><span class="label">ファンネーム</span>後輩</li>
                        <li><span class="label">ファンマーク</span>🦋🎨✍️</li>
                    </ul>
                </div>

                <div class="data-card">
                    <h3 class="card-title">SNS</h3>
                    <ul class="data-list">
                        <li><a href="#" style="color: #fff; text-decoration: none;">▶️ YouTube</a></li>
                        <li><a href="#" style="color: #fff; text-decoration: none;">📱 X (Twitter)</a></li>
                        <li><a href="#" style="color: #fff; text-decoration: none;">📸 Instagram</a></li>
                        <li><a href="#" style="color: #fff; text-decoration: none;">🎵 TikTok</a></li>
                    </ul>
                </div>

                <div class="data-card">
                    <h3 class="card-title">INFO</h3>
                    <ul class="data-list">
                        <li><span class="label">身長</span>173cm</li>
                        <li><span class="label">一人称</span>俺</li>
                        <li><span class="label">所属</span>HOLLOW RECORD</li>
                        <li><span class="label">種類</span>リライティング・アーティスト</li>
                    </ul>
                </div>

            </div></div></div></body>
</html>
